volumes:
  pgdata:

networks:
  arenadata:
    name: arenadata

services:
  adcm:
    image: "hub.arenadata.io/adcm/adcm:2.12.0"
    ports:
      - "80:8000"
    volumes:
      - "/opt/adcm:/adcm/data"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PASS=Ws3iysiw
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
      arenadata: { aliases: [ adcm ] }

  postgres:
    image: "postgres:16.14"
    environment:
      POSTGRES_PASSWORD: Ws3iysiw
      PGDATA: /var/lib/postgresql/data/16
    volumes:
      - "/opt/pgdata:/var/lib/postgresql/data/16"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      arenadata: { aliases: [ postgres ] }
